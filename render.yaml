# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy via: Render dashboard → New → Blueprint → select this repo.
#
# Secrets (sync: false) are prompted for in the dashboard on first deploy and
# never live in this file. JWT_SECRET is generated by Render once and persists
# across deploys — rotating it manually logs out every device.
services:
  - type: web
    name: lista-plus-api
    runtime: node
    plan: free # upgrade before real stores depend on sync: free tier sleeps after ~15 min idle
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      # Load-bearing twice over: prunes devDependencies at build (pino-pretty
      # must be absent in prod) and keeps stack traces out of error responses.
      - key: NODE_ENV
        value: production

      # Public identifier (also embedded in the Android APK) — safe to commit.
      # Must equal the app's requestIdToken(...) Web client ID.
      - key: GOOGLE_CLIENT_ID
        value: 626977685078-meba3p745gas9j9brqj811sl07uir39d.apps.googleusercontent.com

      # Atlas connection string, with password and /listaplus db name.
      - key: MONGODB_URI
        sync: false

      # Render generates a strong random value on first deploy and keeps it.
      - key: JWT_SECRET
        generateValue: true

      # Paste the full service-account JSON as the value (the code accepts raw
      # JSON), or switch to a Secret File and point this at its path.
      - key: GOOGLE_PLAY_SA_KEY
        sync: false

      - key: APP_PACKAGE
        value: com.jorres.listaplus
      - key: LOG_LEVEL
        value: info
      - key: SYNC_MAX_DOCS_PER_USER
        value: "200000"
